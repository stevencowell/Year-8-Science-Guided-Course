chor="middle">5</text><text x="190" y="696" class="h" text-anchor="start">Whole-system explanation</text><line x1="190" y1="723" x2="1455" y2="723" stroke="#9fb3c8" stroke-width="4"/><text x="800" y="825" class="n" text-anchor="middle">Blank lines are for student evidence • numbered stages show reasoning order, not a scientific result</text></svg>