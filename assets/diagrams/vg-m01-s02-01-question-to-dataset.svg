<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">From a question to a dataset</title><desc id="desc">A scientific question leads to an appropriate dataset structure. Fair-test variables apply where appropriate, while observational datasets use numerical or categorical fields. Repeated records, units or categories, missing-value notation and provenance metadata make the dataset interpretable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#176B87"/><text x="80" y="105" text-anchor="start" class="t">From a question to a dataset</text>
  <rect x="60" y="285" width="260" height="220" rx="28" class="box"/><text x="190" y="355" text-anchor="middle" class="h">1  Question</text><text x="190" y="420" text-anchor="middle" class="n">What information</text><text x="190" y="465" text-anchor="middle" class="n">can answer it?</text>
  <line x1="330" y1="395" x2="400" y2="395" class="arrow"/>
  <rect x="390" y="160" width="450" height="580" rx="28" fill="#fff" stroke="#176b87" stroke-width="5"/><text x="615" y="220" text-anchor="middle" class="h">2  Choose dataset structure</text>
  <rect x="420" y="255" width="390" height="185" rx="28" fill="#e7f3f7" stroke="#334155" stroke-width="5"/><text x="615" y="315" text-anchor="middle" class="n">Fair test — where appropriate</text><text x="615" y="365" text-anchor="middle" class="n">independent • dependent • controlled</text><text x="615" y="410" text-anchor="middle" class="n">variables</text>
  <rect x="420" y="490" width="390" height="185" rx="28" fill="#e7f3f7" stroke="#334155" stroke-width="5"/><text x="615" y="550" text-anchor="middle" class="h">Observational dataset</text><text x="615" y="610" text-anchor="middle" class="n">numerical or categorical fields</text><text x="615" y="655" text-anchor="middle" class="n">units or categories</text>
  <path d="M820 345C900 345 900 385 955 385" class="arrow"/><path d="M820 585C900 585 900 455 955 455" class="arrow"/>
  <rect x="965" y="270" width="300" height="330" rx="28" class="box"/><text x="1115" y="335" text-anchor="middle" class="h">3  Record consistently</text><text x="1115" y="405" text-anchor="middle" class="n">repeated records</text><text x="1115" y="465" text-anchor="middle" class="n">missing-value marker</text><text x="1115" y="525" text-anchor="middle" class="n">field meaning</text>
  <line x1="1275" y1="435" x2="1330" y2="435" class="arrow"/>
  <rect x="1340" y="270" width="220" height="330" rx="28" fill="#e7f3f7" stroke="#176b87" stroke-width="5"/><text x="1450" y="335" text-anchor="middle" class="h">4  Metadata</text><text x="1450" y="405" text-anchor="middle" class="n">source • method</text><text x="1450" y="455" text-anchor="middle" class="n">time • changes</text><text x="1450" y="505" text-anchor="middle" class="n">limits • access</text>
  <text x="800" y="810" text-anchor="middle" class="n">No values, observations or collection procedure are supplied</text></svg>