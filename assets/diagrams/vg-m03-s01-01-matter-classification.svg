<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Classification, properties and uses of matter</title><desc id="desc">Matter is classified by composition. Element groups show broad tendencies, and three source-authorised examples connect availability and relevant properties to suitable uses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486581"/></marker><style>.t{font:700 45px Arial,sans-serif;fill:#102a43}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 22px Arial,sans-serif;fill:#243b53}.n{font:600 19px Arial,sans-serif;fill:#486581}.sm{font:600 16px Arial,sans-serif;fill:#486581}.xs{font:600 13px Arial,sans-serif;fill:#486581}.white{fill:#fff}.arrow{fill:none;stroke:#486581;stroke-width:6;marker-end:url(#arrow)}.leader{fill:none;stroke:#486581;stroke-width:4}.dasharrow{fill:none;stroke:#486581;stroke-width:5;stroke-dasharray:14 11;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#f7fafc"/><rect x="70" y="55" width="1460" height="88" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="5"/><text x="800" y="111" class="t" text-anchor="middle">Classification, properties and uses of matter</text>
<rect x="70" y="170" width="910" height="590" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="105" y="215" class="h" text-anchor="start">Classify matter by composition</text>
<rect x="360" y="245" width="310" height="66" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="4"/><text x="515" y="287" class="h" text-anchor="middle">Matter</text>
<path d="M515 311V345M515 345H225V380M515 345V380M515 345H805V380" class="leader"/>
<rect x="100" y="380" width="250" height="155" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="122" y="418" class="h" text-anchor="start">Element</text><text x="122" y="456" class="b" text-anchor="start"><tspan x="122" dy="0">one type of atom</tspan></text><rect x="390" y="380" width="250" height="155" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="412" y="418" class="h" text-anchor="start">Compound</text><text x="412" y="456" class="b" text-anchor="start"><tspan x="412" dy="0">atoms of two or more</tspan><tspan x="412" dy="27">different elements</tspan><tspan x="412" dy="27">chemically joined</tspan></text><rect x="680" y="380" width="250" height="155" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="702" y="418" class="h" text-anchor="start">Mixture</text><text x="702" y="456" class="b" text-anchor="start"><tspan x="702" dy="0">two or more substances</tspan><tspan x="702" dy="27">together without joining</tspan><tspan x="702" dy="27">into one new substance</tspan></text>
<path d="M225 535V565M225 565H135V600M225 565V600M225 565H315V600" class="leader"/>
<rect x="82" y="600" width="145" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="154" y="637" class="n" text-anchor="middle">Metal</text><rect x="236" y="600" width="155" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="313" y="637" class="n" text-anchor="middle">Non-metal</text><rect x="400" y="600" width="160" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="480" y="637" class="n" text-anchor="middle">Metalloid</text>
<text x="105" y="700" class="n" text-anchor="start"><tspan x="105" dy="0">These group descriptions are broad tendencies,</tspan><tspan x="105" dy="27">not universal rules.</tspan></text>
<rect x="1010" y="170" width="520" height="590" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="1045" y="215" class="h" text-anchor="start">Evidence supports a suitable use</text>
<rect x="1050" y="245" width="440" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1270" y="282" class="n" text-anchor="middle">Availability</text><line x1="1270" y1="305" x2="1270" y2="332" class="arrow"/>
<rect x="1050" y="335" width="440" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1270" y="372" class="n" text-anchor="middle">Relevant properties</text><line x1="1270" y1="395" x2="1270" y2="422" class="arrow"/>
<rect x="1050" y="425" width="440" height="58" rx="18" fill="#fff7e6" stroke="#486581" stroke-width="3"/><text x="1270" y="462" class="n" text-anchor="middle">Suitable use for this context</text>
<text x="1050" y="530" class="b" text-anchor="start"><tspan x="1050" dy="0">Copper — element, metal</tspan><tspan x="1050" dy="32">conducts electricity; drawn into wires → wiring</tspan><tspan x="1050" dy="32">Silicon — element, metalloid</tspan><tspan x="1050" dy="32">controlled electrical behaviour → components</tspan><tspan x="1050" dy="32">Silicon dioxide — compound in quartz/sand</tspan><tspan x="1050" dy="32">raw material → glass</tspan></text>
<text x="800" y="815" class="n" text-anchor="middle">Solid lines show classification branches or the evidence-to-use reasoning sequence.</text></svg>