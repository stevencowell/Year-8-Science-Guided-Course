<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Anatomy of an interpretable graph</title><desc id="desc">A generic blank graph frame identifies the title, labelled axes, units, consistent scale and source note needed before patterns are interpreted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#176B87"/><text x="80" y="105" text-anchor="start" class="t">Anatomy of an interpretable graph</text>
  <rect x="160" y="205" width="950" height="565" rx="28" class="box"/>
  <line x1="300" y1="660" x2="965" y2="660" stroke="#334155" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="300" y1="660" x2="300" y2="315" stroke="#334155" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="300" y1="390" x2="940" y2="390" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/><line x1="300" y1="480" x2="940" y2="480" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/><line x1="300" y1="570" x2="940" y2="570" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/>
  <line x1="440" y1="330" x2="440" y2="660" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/><line x1="580" y1="330" x2="580" y2="660" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/><line x1="720" y1="330" x2="720" y2="660" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/><line x1="860" y1="330" x2="860" y2="660" stroke="#c7d3dc" stroke-width="3" stroke-dasharray="14 14"/>
  <text x="635" y="275" text-anchor="middle" class="h">Descriptive graph title</text><text x="635" y="735" text-anchor="middle" class="h">Independent variable (unit)</text><text x="225" y="500" text-anchor="middle" class="h">Dependent</text><text x="225" y="550" text-anchor="middle" class="b">variable (unit)</text>
  <rect x="1190" y="220" width="330" height="470" rx="28" fill="#e7f3f7" stroke="#176B87" stroke-width="6"/>
  <text x="1355" y="295" text-anchor="middle" class="h">Before interpreting</text><text x="1240" y="375" text-anchor="start" class="b">✓ clear title</text><text x="1240" y="440" text-anchor="start" class="b">✓ axes + units</text><text x="1240" y="505" text-anchor="start" class="b">✓ consistent scale</text><text x="1240" y="570" text-anchor="start" class="b">✓ source note</text>
  <rect x="1190" y="720" width="330" height="90" rx="20" class="box"/><text x="1355" y="780" text-anchor="middle" class="n">Source: ______</text></svg>