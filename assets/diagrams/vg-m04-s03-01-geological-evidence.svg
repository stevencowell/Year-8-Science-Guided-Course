<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Geological change, independent evidence and comparison</title><desc id="desc">A non-linear rock-change network, relative-age layers, independent plate evidence, observable properties and equal-scale Earth–Mars comparison are explicitly labelled and mapped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486581"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#102a43}.h{font:700 25px Arial,sans-serif;fill:#102a43}.b{font:400 21px Arial,sans-serif;fill:#243b53}.n{font:600 18px Arial,sans-serif;fill:#486581}.sm{font:600 15px Arial,sans-serif;fill:#486581}.xs{font:600 12px Arial,sans-serif;fill:#486581}.white{fill:#fff}.arrow{fill:none;stroke:#486581;stroke-width:5;marker-end:url(#arrow)}.leader{fill:none;stroke:#486581;stroke-width:3}.dash{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10}.dasharrow{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#f7fafc"/><rect x="70" y="55" width="1460" height="88" rx="18" fill="#fff" stroke="#a23b3b" stroke-width="5"/><text x="800" y="111" class="t" text-anchor="middle">Geological change, independent evidence and comparison</text>
<rect x="70" y="170" width="700" height="280" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="100" y="205" class="h" text-anchor="start">Non-linear rock-change network — different routes</text>
<rect x="100" y="245" width="150" height="55" rx="16" fill="#fbecec" stroke="#486581" stroke-width="3"/><text x="175" y="279" class="sm" text-anchor="middle">Molten material</text><rect x="310" y="235" width="150" height="55" rx="16" fill="#fbecec" stroke="#486581" stroke-width="3"/><text x="385" y="269" class="sm" text-anchor="middle">Igneous rock</text><rect x="570" y="235" width="165" height="55" rx="16" fill="#fbecec" stroke="#486581" stroke-width="3"/><text x="652" y="269" class="sm" text-anchor="middle">Metamorphic rock</text><rect x="310" y="365" width="180" height="55" rx="16" fill="#fbecec" stroke="#486581" stroke-width="3"/><text x="400" y="399" class="sm" text-anchor="middle">Sedimentary rock</text>
<path d="M250 270H305" class="arrow"/><text x="277" y="258" class="xs" text-anchor="middle">cooling</text><path d="M460 262H565" class="arrow"/><text x="512" y="250" class="xs" text-anchor="middle">heat/pressure</text><path d="M590 292C555 355 515 385 495 390" class="arrow"/><text x="575" y="350" class="xs" text-anchor="middle">weathering → transport → deposition</text><path d="M310 390C245 380 210 335 205 305" class="arrow"/><text x="210" y="365" class="xs" text-anchor="middle">melting</text><path d="M380 360C420 325 495 315 570 280" class="arrow"/><text x="470" y="314" class="xs" text-anchor="middle">change without complete melting</text><text x="105" y="438" class="xs" text-anchor="start">No fixed start and no compulsory single loop; arrows show possible qualitative pathways.</text>
<rect x="805" y="170" width="725" height="280" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="835" y="205" class="h" text-anchor="start">Plate process and independent evidence comparison</text>
<text x="850" y="235" class="n" text-anchor="start">Past connection evidence</text><path d="M855 270Q900 245 945 275L940 370Q900 390 860 355Z" fill="#e8d6b1" stroke="#486581" stroke-width="3"/><path d="M1085 270Q1040 245 995 275L1000 370Q1040 390 1080 355Z" fill="#e8d6b1" stroke="#486581" stroke-width="3"/><circle cx="915" cy="310" r="9" fill="#fff" stroke="#a23b3b" stroke-width="3"/><circle cx="1025" cy="310" r="9" fill="#fff" stroke="#a23b3b" stroke-width="3"/><line x1="875" y1="340" x2="925" y2="340" stroke="#176b87" stroke-width="7"/><line x1="1015" y1="340" x2="1065" y2="340" stroke="#176b87" stroke-width="7"/><text x="850" y="405" class="xs" text-anchor="start"><tspan x="850" dy="0">matching fossil symbols • matching rock bands</tspan><tspan x="850" dy="19">continental-margin shapes suggest a possible fit</tspan></text>
<text x="1160" y="235" class="n" text-anchor="start">Active boundary evidence</text><line x1="1160" y1="315" x2="1280" y2="315" class="arrow"/><line x1="1470" y1="315" x2="1350" y2="315" class="arrow"/><path d="M1280 335L1315 300L1350 335" fill="none" stroke="#486581" stroke-width="8"/><text x="1315" y="285" class="xs" text-anchor="middle">plates interact</text><circle cx="1300" cy="345" r="9" fill="#fff" stroke="#a23b3b" stroke-width="3"/><path d="M1380 355L1395 325L1410 355Z" fill="#fff" stroke="#a23b3b" stroke-width="3"/><text x="1160" y="390" class="xs" text-anchor="start"><tspan x="1160" dy="0">stress release → earthquake evidence</tspan><tspan x="1160" dy="18">molten rock rising → volcano evidence</tspan><tspan x="1160" dy="18">broad concentrations support active crustal change</tspan></text>
<rect x="70" y="480" width="700" height="280" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="100" y="515" class="h" text-anchor="start">Relative-age layers, fossils and observable properties</text><rect x="105" y="550" width="270" height="36" transform="translate(0 0)" fill="#ead9b7" stroke="#486581" stroke-width="2"/><rect x="105" y="550" width="270" height="36" transform="translate(0 36)" fill="#d9ba8a" stroke="#486581" stroke-width="2"/><rect x="105" y="550" width="270" height="36" transform="translate(0 72)" fill="#b78c63" stroke="#486581" stroke-width="2"/><rect x="105" y="550" width="270" height="36" transform="translate(0 108)" fill="#8d6e63" stroke="#486581" stroke-width="2"/><circle cx="165" cy="605" r="12" fill="#fff" stroke="#a23b3b" stroke-width="3"/><circle cx="315" cy="675" r="12" fill="#fff" stroke="#176b87" stroke-width="3"/><text x="105" y="715" class="xs" text-anchor="start"><tspan x="105" dy="0">fossil A and fossil B = evidence in different layers</tspan><tspan x="105" dy="18">undisturbed lower layers are generally older; no exact ages</tspan></text>
<rect x="405" y="545" width="330" height="190" rx="16" fill="#fbecec" stroke="#486581" stroke-width="3"/><text x="425" y="575" class="sm" text-anchor="start">Rock/mineral comparison: Sample A | Sample B</text><text x="425" y="605" class="xs" text-anchor="start"><tspan x="425" dy="0">colour/appearance</tspan><tspan x="425" dy="20">grain or crystal size</tspan><tspan x="425" dy="20">texture</tspan><tspan x="425" dy="20">lustre and transparency</tspan><tspan x="425" dy="20">layering and visible fossils</tspan><tspan x="425" dy="20">Several observations are stronger than one.</tspan></text>
<rect x="805" y="480" width="725" height="280" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="835" y="515" class="h" text-anchor="start">Earth and Mars — compare the same stated scale</text><text x="1110" y="550" class="n" text-anchor="middle">Earth</text><text x="1370" y="550" class="n" text-anchor="middle">Mars</text><text x="830" y="597" class="xs" text-anchor="start">Whole planet</text><rect x="925" y="570" width="270" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1060" y="596" class="xs" text-anchor="middle">iron, oxygen, silicon, magnesium</text><rect x="1210" y="570" width="285" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1352" y="596" class="xs" text-anchor="middle">compare whole-planet evidence</text><text x="830" y="649" class="xs" text-anchor="start">Crust</text><rect x="925" y="622" width="270" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1060" y="648" class="xs" text-anchor="middle">especially oxygen and silicon</text><rect x="1210" y="622" width="285" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1352" y="648" class="xs" text-anchor="middle">compare crust evidence</text><text x="830" y="701" class="xs" text-anchor="start">Surface</text><rect x="925" y="674" width="270" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1060" y="700" class="xs" text-anchor="middle">compare surface evidence</text><rect x="1210" y="674" width="285" height="42" rx="16" fill="#fff" stroke="#9fb3c8" stroke-width="2"/><text x="1352" y="700" class="xs" text-anchor="middle">oxygen, silicon, iron in rocks/dust</text><text x="835" y="742" class="xs" text-anchor="start">Unlike whole-planet, crust and surface bases are not equivalent.</text>
<line x1="80" y1="800" x2="125" y2="800" class="arrow"/><text x="135" y="804" class="xs" text-anchor="start">process/pathway</text><circle cx="285" cy="800" r="8" fill="#fff" stroke="#a23b3b" stroke-width="3"/><text x="300" y="804" class="xs" text-anchor="start">matching fossil / earthquake symbol as labelled</text><line x1="590" y1="800" x2="635" y2="800" stroke="#176b87" stroke-width="7"/><text x="645" y="804" class="xs" text-anchor="start">matching rock band</text><path d="M800 809L810 789L820 809Z" fill="#fff" stroke="#a23b3b" stroke-width="3"/><text x="830" y="804" class="xs" text-anchor="start">volcano evidence</text><line x1="975" y1="800" x2="1020" y2="800" class="leader"/><text x="1030" y="804" class="xs" text-anchor="start">leader identifies a feature</text><text x="800" y="835" class="xs" text-anchor="middle">Panel borders organise evidence types only; colours do not encode strength, age, rate or quantity.</text></svg>