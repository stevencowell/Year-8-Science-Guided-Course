<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Exchange and transport between body systems</title><desc id="desc">Respiratory and digestive systems supply oxygen and nutrients to the circulatory system; it transports materials to cells and carries carbon dioxide and other wastes to removal systems.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#287D3C"/><text x="80" y="105" text-anchor="start" class="t">Exchange and transport between body systems</text>
  <rect x="650" y="320" width="300" height="180" rx="90" fill="#e6f4ea" stroke="#287D3C" stroke-width="8"/><text x="800" y="395" text-anchor="middle" class="h">Circulatory</text><text x="800" y="445" text-anchor="middle" class="b">transport</text>
  <rect x="100" y="220" width="380" height="150" rx="28" class="box"/><text x="290" y="285" text-anchor="middle" class="h">Respiratory system</text><text x="290" y="335" text-anchor="middle" class="b">oxygen in</text>
  <rect x="100" y="550" width="380" height="150" rx="28" class="box"/><text x="290" y="615" text-anchor="middle" class="h">Digestive system</text><text x="290" y="665" text-anchor="middle" class="b">nutrients in</text>
  <rect x="1120" y="220" width="380" height="150" rx="28" class="box"/><text x="1310" y="285" text-anchor="middle" class="h">Body cells</text><text x="1310" y="335" text-anchor="middle" class="b">materials exchanged</text>
  <rect x="1120" y="550" width="380" height="150" rx="28" class="box"/><text x="1310" y="615" text-anchor="middle" class="h">Excretory system</text><text x="1310" y="665" text-anchor="middle" class="b">other wastes out</text>
  <path d="M480 275 C570 275 575 345 645 375" class="arrow"/><path d="M645 445 C565 465 560 365 480 335" class="arrow"/><path d="M480 625 C570 625 575 475 645 445" class="arrow"/>
  <path d="M955 375 C1030 350 1045 295 1115 295" class="arrow"/><path d="M1115 335 C1040 390 1035 430 955 445" class="arrow"/>
  <path d="M955 445 C1035 470 1040 625 1115 625" class="arrow"/><text x="540" y="225" text-anchor="middle" class="n">oxygen to transport</text><text x="545" y="520" text-anchor="middle" class="n">carbon dioxide to respiratory system</text><text x="1035" y="185" text-anchor="middle" class="n">carbon dioxide returns from cells</text></svg>