<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Plant structure and transport</title><desc id="desc">Roots and root-hair cells absorb water and mineral ions. Xylem carries them upward. Leaves contain palisade cells for photosynthesis and stomata with guard cells for gas exchange. Phloem transports sugars.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#287D3C"/><text x="80" y="105" text-anchor="start" class="t">Plant structure and transport</text>
  <line x1="765" y1="235" x2="765" y2="660" stroke="#77543b" stroke-width="62"/>
  <ellipse cx="620" cy="255" rx="165" ry="72" fill="#70b873" stroke="#287d3c" stroke-width="7"/><ellipse cx="900" cy="335" rx="165" ry="72" fill="#70b873" stroke="#287d3c" stroke-width="7"/>
  <path d="M765 650 Q650 750 540 780 M765 650 Q765 790 765 830 M765 650 Q880 750 990 780" fill="none" stroke="#77543b" stroke-width="25" stroke-linecap="round"/>
  <path d="M725 685L725 270" stroke="#1677a8" stroke-width="15" marker-end="url(#arrow)"/><path d="M805 270L805 685" stroke="#c8861a" stroke-width="15" marker-end="url(#arrow)"/>
  <text x="940" y="555" text-anchor="start" class="n">Xylem ↑ water + mineral ions</text><text x="940" y="620" text-anchor="start" class="n">Phloem ↓ dissolved sugars</text><text x="465" y="835" text-anchor="middle" class="n">Root-hair cells increase absorption area</text>
  <rect x="80" y="195" width="380" height="330" rx="28" fill="#e8f5ea" stroke="#287D3C" stroke-width="5"/><text x="270" y="255" text-anchor="middle" class="h">Leaf detail</text>
  <rect x="135" y="300" width="270" height="78" rx="18" fill="#91c788"/><text x="270" y="350" text-anchor="middle" class="n">palisade cells</text>
  <ellipse cx="225" cy="440" rx="55" ry="32" fill="#69a96b"/><ellipse cx="315" cy="440" rx="55" ry="32" fill="#69a96b"/><ellipse cx="270" cy="440" rx="22" ry="12" fill="#fff"/><text x="270" y="500" text-anchor="middle" class="n">stoma + guard cells</text>
  <text x="1200" y="285" text-anchor="middle" class="h">Leaves</text><text x="1200" y="345" text-anchor="middle" class="b">photosynthesis</text><text x="1200" y="395" text-anchor="middle" class="b">gas exchange</text></svg>