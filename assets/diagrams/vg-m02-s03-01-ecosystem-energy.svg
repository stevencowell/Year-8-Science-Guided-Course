<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ecosystem energy and population evidence</title><desc id="desc">A simple food web shows producers, consumers and decomposers. A qualitative pyramid shows less available energy at higher feeding levels, and a hypothetical graph shows association without proving cause.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#287D3C"/><text x="80" y="105" text-anchor="start" class="t">Ecosystem energy and population evidence</text>
  <text x="325" y="185" text-anchor="middle" class="h">Food web</text><text x="800" y="185" text-anchor="middle" class="h">Available energy</text><text x="1280" y="185" text-anchor="middle" class="h">Hypothetical populations</text>
  <rect x="100" y="260" width="230" height="100" rx="28" class="box"/><text x="215" y="325" text-anchor="middle" class="h">Producer</text><rect x="420" y="220" width="250" height="100" rx="28" class="box"/><text x="545" y="285" text-anchor="middle" class="h">Consumer A</text><rect x="420" y="410" width="250" height="100" rx="28" class="box"/><text x="545" y="475" text-anchor="middle" class="h">Consumer B</text><rect x="170" y="590" width="310" height="100" rx="28" class="box"/><text x="325" y="655" text-anchor="middle" class="h">Decomposer</text>
  <line x1="335" y1="300" x2="410" y2="275" class="arrow"/><line x1="335" y1="335" x2="410" y2="440" class="arrow"/><path d="M550 330C735 350 720 630 490 640" class="arrow"/><line x1="500" y1="520" x2="420" y2="580" class="arrow"/>
  <text x="325" y="765" text-anchor="middle" class="n">Arrows show energy transfer</text>
  <polygon points="760,650 1040,650 1000,560 800,560" fill="#7fbd78" stroke="#334155" stroke-width="5"/><polygon points="800,550 1000,550 965,460 835,460" fill="#efc96d" stroke="#334155" stroke-width="5"/><polygon points="835,450 965,450 930,360 870,360" fill="#d98267" stroke="#334155" stroke-width="5"/>
  <text x="900" y="625" text-anchor="middle" class="n">producers</text><text x="900" y="525" text-anchor="middle" class="n">primary consumers</text><text x="900" y="425" text-anchor="middle" class="n">higher consumers</text><text x="900" y="735" text-anchor="middle" class="n">less available energy</text>
  <rect x="1110" y="250" width="410" height="400" rx="24" fill="#e8f5ea" stroke="#287D3C" stroke-width="5"/><line x1="1170" y1="590" x2="1465" y2="590" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/><line x1="1170" y1="590" x2="1170" y2="315" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1190" y1="300" x2="1250" y2="300" stroke="#176b87" stroke-width="10"/><text x="1275" y="312" text-anchor="start" class="n">Population A</text><text x="1275" y="357" text-anchor="start" class="n">Population B</text><line x1="1190" y1="345" x2="1250" y2="345" stroke="#a23b3b" stroke-width="10"/>
  <polyline points="1190,530 1260,490 1330,510 1400,420 1460,390" fill="none" stroke="#176b87" stroke-width="10"/><polyline points="1190,560 1260,540 1330,465 1400,485 1460,430" fill="none" stroke="#a23b3b" stroke-width="10"/>
  <text x="1315" y="710" text-anchor="middle" class="n">time →</text><text x="1315" y="765" text-anchor="middle" class="n">association ≠ cause</text></svg>