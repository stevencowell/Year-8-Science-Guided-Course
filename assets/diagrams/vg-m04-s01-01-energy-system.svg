<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Energy transfers, stores and system boundaries</title><desc id="desc">A chosen system is shown within labelled surroundings with energy stores, transformation, useful transfer and transfer to surroundings. Distinct thermal pathways and open-versus-closed boundaries are fully mapped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486581"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#102a43}.h{font:700 25px Arial,sans-serif;fill:#102a43}.b{font:400 21px Arial,sans-serif;fill:#243b53}.n{font:600 18px Arial,sans-serif;fill:#486581}.sm{font:600 15px Arial,sans-serif;fill:#486581}.xs{font:600 12px Arial,sans-serif;fill:#486581}.white{fill:#fff}.arrow{fill:none;stroke:#486581;stroke-width:5;marker-end:url(#arrow)}.leader{fill:none;stroke:#486581;stroke-width:3}.dash{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10}.dasharrow{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#f7fafc"/><rect x="70" y="55" width="1460" height="88" rx="18" fill="#fff" stroke="#a23b3b" stroke-width="5"/><text x="800" y="111" class="t" text-anchor="middle">Energy transfers, stores and system boundaries</text>
<rect x="70" y="170" width="780" height="400" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="105" y="208" class="h" text-anchor="start">Chosen energy system and surroundings</text><text x="105" y="240" class="n" text-anchor="start">SURROUNDINGS</text><rect x="165" y="265" width="620" height="245" rx="16" fill="#fbecec" stroke="#486581" stroke-width="5"/><text x="475" y="295" class="n" text-anchor="middle">CHOSEN SYSTEM BOUNDARY</text>
<rect x="205" y="335" width="155" height="70" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="282" y="362" class="sm" text-anchor="middle">starting</text><text x="282" y="386" class="n" text-anchor="middle">energy store</text><line x1="365" y1="370" x2="450" y2="370" class="arrow"/><text x="408" y="350" class="xs" text-anchor="middle">energy transfer</text><rect x="455" y="335" width="155" height="70" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="532" y="362" class="n" text-anchor="middle">transformation</text><text x="532" y="387" class="sm" text-anchor="middle">within system</text><line x1="615" y1="370" x2="700" y2="370" class="arrow"/><rect x="700" y="335" width="65" height="70" rx="16" fill="#fff" stroke="#486581" stroke-width="3"/><text x="732" y="363" class="xs" text-anchor="middle">changed</text><text x="732" y="386" class="sm" text-anchor="middle">store</text>
<line x1="610" y1="435" x2="825" y2="435" class="dasharrow"/><text x="705" y="425" class="xs" text-anchor="middle">energy transferred to surroundings</text><text x="205" y="470" class="sm" text-anchor="start"><tspan x="205" dy="0">Conservation account: energy is transferred or transformed, not created or destroyed.</tspan><tspan x="205" dy="22">Trace starting store → transfers/transformations → changed store + transfer to surroundings.</tspan></text>
<rect x="70" y="595" width="780" height="165" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="105" y="628" class="h" text-anchor="start">Thermal-energy transfer pathways</text><text x="180" y="665" class="n" text-anchor="middle">Conduction</text><line x1="115" y1="700" x2="245" y2="700" class="arrow"/><text x="180" y="730" class="xs" text-anchor="middle">straight: particle interactions</text><text x="425" y="665" class="n" text-anchor="middle">Convection</text><path d="M360 720C330 665 390 645 420 680C450 720 500 700 485 660" class="arrow"/><text x="425" y="740" class="xs" text-anchor="middle">curved: bulk fluid movement</text><text x="690" y="665" class="n" text-anchor="middle">Radiation</text><path d="M620 690Q650 665 680 690T740 690T800 690" class="arrow"/><text x="710" y="730" class="xs" text-anchor="middle">wavy: across space</text>
<rect x="880" y="170" width="650" height="590" rx="16" fill="#fff" stroke="#a23b3b" stroke-width="4"/><text x="915" y="208" class="h" text-anchor="start">Open and closed chosen boundaries</text>
<rect x="930" y="255" width="550" height="170" rx="16" fill="#fbecec" stroke="#9fb3c8" stroke-width="3"/><text x="955" y="285" class="h" text-anchor="start">Open system</text><rect x="1040" y="310" width="320" height="75" rx="16" fill="#fff" stroke="#486581" stroke-width="4"/><text x="1200" y="355" class="sm" text-anchor="middle">chosen system boundary</text><line x1="970" y1="325" x2="1430" y2="325" class="arrow"/><text x="975" y="315" class="xs" text-anchor="start">matter</text><line x1="970" y1="375" x2="1430" y2="375" class="arrow"/><text x="975" y="365" class="xs" text-anchor="start">energy</text><text x="955" y="410" class="sm" text-anchor="start">Matter and energy may cross.</text>
<rect x="930" y="450" width="550" height="170" rx="16" fill="#fbecec" stroke="#9fb3c8" stroke-width="3"/><text x="955" y="480" class="h" text-anchor="start">Closed system</text><rect x="1040" y="505" width="320" height="75" rx="16" fill="#fff" stroke="#486581" stroke-width="4"/><text x="1200" y="550" class="sm" text-anchor="middle">chosen system boundary</text><line x1="970" y1="560" x2="1430" y2="560" class="arrow"/><text x="975" y="550" class="xs" text-anchor="start">energy</text><text x="955" y="605" class="sm" text-anchor="start">Energy may cross; matter remains within this model.</text>
<text x="915" y="655" class="h" text-anchor="start">Legend</text><line x1="930" y1="690" x2="995" y2="690" class="arrow"/><text x="1005" y="695" class="sm" text-anchor="start">solid arrow = energy or labelled matter transfer</text><line x1="930" y1="720" x2="995" y2="720" class="dasharrow"/><text x="1005" y="725" class="sm" text-anchor="start">dashed arrow = energy transferred to surroundings</text><text x="915" y="750" class="sm" text-anchor="start">Boundary outline = chosen system • curved/wavy shapes identify named pathways</text>
<text x="800" y="815" class="n" text-anchor="middle">A closed system is not isolated; every arrow and boundary convention is explained in the legend.</text></svg>