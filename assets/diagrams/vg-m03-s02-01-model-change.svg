<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Atomic structure and changing models</title><desc id="desc">A labelled shell-style atomic structure model identifies nucleus, proton, neutron and electron. A four-stage sequence shows technology enabling evidence, an earlier-model limitation and evidence-supported revision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#486581"/></marker><style>.t{font:700 44px Arial,sans-serif;fill:#102a43}.h{font:700 25px Arial,sans-serif;fill:#102a43}.b{font:400 21px Arial,sans-serif;fill:#243b53}.n{font:600 18px Arial,sans-serif;fill:#486581}.sm{font:600 15px Arial,sans-serif;fill:#486581}.xs{font:600 12px Arial,sans-serif;fill:#486581}.white{fill:#fff}.arrow{fill:none;stroke:#486581;stroke-width:5;marker-end:url(#arrow)}.leader{fill:none;stroke:#486581;stroke-width:3}.dash{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10}.dasharrow{fill:none;stroke:#486581;stroke-width:4;stroke-dasharray:13 10;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#f7fafc"/><rect x="70" y="55" width="1460" height="88" rx="18" fill="#fff" stroke="#8a5a13" stroke-width="5"/><text x="800" y="111" class="t" text-anchor="middle">Atomic structure and changing models</text>
<rect x="70" y="170" width="760" height="590" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="105" y="210" class="h" text-anchor="start">Simple shell-style atomic structure model</text>
<circle cx="375" cy="450" r="205" fill="none" stroke="#9fb3c8" stroke-width="4" stroke-dasharray="13 10"/><circle cx="375" cy="450" r="92" fill="#fff7e6" stroke="#8a5a13" stroke-width="5"/><circle cx="345" cy="430" r="25" fill="#f2b8a0" stroke="#486581" stroke-width="3"/><circle cx="405" cy="470" r="25" fill="#d9eaf0" stroke="#486581" stroke-width="3"/><circle cx="540" cy="335" r="21" fill="#fff" stroke="#176b87" stroke-width="4"/><text x="345" y="439" class="h" text-anchor="middle">+</text><text x="405" y="479" class="h" text-anchor="middle">0</text><text x="540" y="342" class="h" text-anchor="middle">−</text>
<text x="375" y="342" class="n" text-anchor="middle">nucleus</text><path d="M210 350L330 420" class="leader"/><text x="105" y="345" class="n" text-anchor="start">proton: positive</text><path d="M535 520L420 480" class="leader"/><text x="545" y="528" class="n" text-anchor="start">neutron: no charge</text><path d="M610 295L555 325" class="leader"/><text x="615" y="292" class="n" text-anchor="start">electron: negative</text>
<text x="105" y="685" class="sm" text-anchor="start"><tspan x="105" dy="0">Proton and neutron: similar relative mass</tspan><tspan x="105" dy="22">Electron: much smaller relative mass</tspan><tspan x="105" dy="22">Dashed shell line organises electron information;</tspan><tspan x="105" dy="22">it is not a literal path and the model is not to scale.</tspan></text>
<rect x="860" y="170" width="670" height="590" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="895" y="210" class="h" text-anchor="start">How evidence can change a model</text>
<rect x="900" y="245" width="590" height="88" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="918" y="279" class="h" text-anchor="start">1  Improved technology</text><text x="918" y="310" class="sm" text-anchor="start"><tspan x="918" dy="0">can enable new observations or evidence</tspan></text><line x1="1195" y1="335" x2="1195" y2="355" class="arrow"/>
<rect x="900" y="360" width="590" height="88" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="918" y="394" class="h" text-anchor="start">2  New observation or evidence</text><text x="918" y="425" class="sm" text-anchor="start"><tspan x="918" dy="0">may not fit what an earlier model explains</tspan></text><line x1="1195" y1="450" x2="1195" y2="470" class="arrow"/>
<rect x="900" y="475" width="590" height="88" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="918" y="509" class="h" text-anchor="start">3  Earlier-model limitation revealed</text><text x="918" y="540" class="sm" text-anchor="start"><tspan x="918" dy="0">an important observation remains unexplained</tspan></text><line x1="1195" y1="565" x2="1195" y2="585" class="arrow"/>
<rect x="900" y="590" width="590" height="88" rx="16" fill="#fff" stroke="#8a5a13" stroke-width="4"/><text x="918" y="624" class="h" text-anchor="start">4  Model revised or replaced</text><text x="918" y="655" class="sm" text-anchor="start"><tspan x="918" dy="0">when evidence supports a better explanation</tspan></text>
<rect x="920" y="700" width="550" height="42" rx="16" fill="#fff7e6" stroke="#8a5a13" stroke-width="3"/><text x="1195" y="727" class="sm" text-anchor="middle">Useful representation: important features shown • limits remain</text>
<text x="800" y="815" class="n" text-anchor="middle">Solid arrows show the evidence-to-revision reasoning sequence; no dates, instruments or experiments are claimed.</text></svg>