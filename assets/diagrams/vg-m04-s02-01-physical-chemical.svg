<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">From observations to a cautious conclusion</title><desc id="desc">Supplied observations are considered together with possible alternatives before a physical, chemical or uncertain conclusion is drawn. A separate word-equation scaffold places supplied reactant names before the arrow and product names after it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 50px Arial,sans-serif;fill:#102a43}.h{font:700 42px Arial,sans-serif;fill:#102a43}.b{font:400 34px Arial,sans-serif;fill:#243b53}.n{font:600 32px Arial,sans-serif;fill:#334e68}.sm{font:600 26px Arial,sans-serif;fill:#334e68}.arrow{fill:none;stroke:#334155;stroke-width:8;marker-end:url(#arrow)}.box{fill:#fff;stroke:#334155;stroke-width:5}.white{fill:#fff}</style></defs><rect width="1600" height="900" fill="#f8fbfd"/><rect width="1600" height="18" fill="#A23B3B"/><text x="80" y="105" text-anchor="start" class="t">From observations to a cautious conclusion</text>
  <text x="540" y="185" text-anchor="middle" class="h">Evidence to conclusion</text>
  <rect x="50" y="250" width="280" height="240" rx="28" class="box"/><text x="190" y="315" text-anchor="middle" class="h">1  Observe</text><text x="190" y="365" text-anchor="middle" class="n">supplied record</text><text x="190" y="420" text-anchor="middle" class="n">____________</text>
  <rect x="390" y="250" width="300" height="240" rx="28" class="box"/><text x="540" y="315" text-anchor="middle" class="h">2  Compare</text><text x="540" y="375" text-anchor="middle" class="n">consistency</text><text x="540" y="425" text-anchor="middle" class="n">+ alternatives</text>
  <rect x="750" y="250" width="300" height="240" rx="28" fill="#f8e8e8" stroke="#334155" stroke-width="5"/><text x="900" y="315" text-anchor="middle" class="h">3  Conclude</text><text x="900" y="375" text-anchor="middle" class="n">physical / chemical</text><text x="900" y="425" text-anchor="middle" class="n">or uncertain</text>
  <line x1="340" y1="370" x2="380" y2="370" class="arrow"/><line x1="700" y1="370" x2="740" y2="370" class="arrow"/>
  <rect x="180" y="565" width="720" height="105" rx="22" fill="#f8e8e8" stroke="#A23B3B" stroke-width="5"/><text x="540" y="630" text-anchor="middle" class="h">One sign alone ≠ proof</text>
  <line x1="1160" y1="180" x2="1160" y2="770" stroke="#d9a0a0" stroke-width="5" stroke-dasharray="14 12"/>
  <text x="1380" y="185" text-anchor="middle" class="h">Word equation</text><rect x="1180" y="340" width="170" height="175" rx="28" class="box"/><text x="1265" y="400" text-anchor="middle" class="n">reactant</text><text x="1265" y="445" text-anchor="middle" class="n">name(s)</text><text x="1265" y="490" text-anchor="middle" class="n">supplied</text>
  <line x1="1360" y1="427" x2="1400" y2="427" class="arrow"/><text x="1380" y="370" text-anchor="middle" class="n">forms</text>
  <rect x="1410" y="340" width="170" height="175" rx="28" class="box"/><text x="1495" y="400" text-anchor="middle" class="n">product</text><text x="1495" y="445" text-anchor="middle" class="n">name(s)</text><text x="1495" y="490" text-anchor="middle" class="n">supplied</text><text x="1380" y="600" text-anchor="middle" class="n">reactant(s) → product(s)</text><text x="1380" y="755" text-anchor="middle" class="n">Arrow = forms, not procedure</text></svg>